<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D FDTD 偶极子天线仿真</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e; color: #eee; font-family: 'Segoe UI', Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; padding: 15px;
}
h1 { font-size: 20px; margin: 8px 0; color: #e94560; }
.container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
.panel { background: #16213e; border-radius: 10px; padding: 12px; }
canvas { display: block; }
.controls {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  justify-content: center; margin-top: 10px;
}
.controls button {
  background: #0f3460; color: #eee; border: none; padding: 8px 18px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
}
.controls button:hover { background: #e94560; }
.controls label { font-size: 13px; color: #aaa; }
.info { font-size: 13px; color: #aaa; margin-top: 8px; text-align: center; }
.info span { color: #e94560; font-weight: bold; }
</style>
</head>
<body>
<h1>2D FDTD 偶极子天线仿真</h1>
<div class="container">
  <div class="panel">
    <h3>Ez 场分布</h3>
    <canvas id="fieldCanvas" width="480" height="480"></canvas>
    <div class="info">步进: <span id="stepDisplay">0</span></div>
  </div>
  <div class="panel">
    <h3>辐射方向图</h3>
    <canvas id="patternCanvas" width="480" height="480"></canvas>
    <div class="info">归一化 |Ez| (极坐标)</div>
  </div>
</div>
<div class="controls">
  <button id="btnPlay">暂停</button>
  <button id="btnReset">重置</button>
  <label>速度: <input type="range" id="speedRange" min="1" max="10" value="3"></label>
</div>

<script>
const NX = 160, NY = 160;
const DLEN = 30, FGAP = 4;
const CX = NX >> 1, CY = NY >> 1;
const DT = 0.5 / Math.sqrt(2);

var Ez = new Float64Array(NX * NY);
var Hx = new Float64Array(NX * NY);
var Hy = new Float64Array(NX * NY);
var EzPrev = new Float64Array(NX * NY);
var PEC = new Uint8Array(NX * NY);
var srcJ = [];
var step = 0;
var running = true;

function idx(i, j) { return i * NY + j; }

(function init() {
  var half = DLEN >> 1, gh = FGAP >> 1;
  var ds = CY - half, de = CY + half;
  var gs = CY - gh, ge = CY + gh;
  for (var i = CX; i < Math.min(CX + 3, NX); i++)
    for (var j = ds; j <= de; j++)
      if (j >= 0 && j < NY && !(j >= gs && j <= ge))
        PEC[idx(i, j)] = 1;
  for (var j = CY - gh; j <= CY + gh; j++)
    if (j >= 0 && j < NY) srcJ.push(j);
})();

function pulse(t) {
  var x = (t - 40) / 12;
  return Math.exp(-x * x);
}

function stepFDTD() {
  var i, j, ij, ij1, i1j;
  var abc = (0.5 - 1) / (0.5 + 1);

  for (i = 0; i < NX; i++)
    for (j = 0; j < NY - 1; j++)
      Hx[idx(i, j)] -= DT * (Ez[idx(i, j + 1)] - Ez[idx(i, j)]);

  for (i = 0; i < NX - 1; i++)
    for (j = 0; j < NY; j++)
      Hy[idx(i, j)] += DT * (Ez[idx(i + 1, j)] - Ez[idx(i, j)]);

  for (i = 1; i < NX - 1; i++)
    for (j = 1; j < NY - 1; j++) {
      ij = idx(i, j);
      Ez[ij] += DT * ((Hy[ij] - Hy[idx(i - 1, j)]) - (Hx[ij] - Hx[idx(i, j - 1)]));
    }

  var s = pulse(step);
  for (var k = 0; k < srcJ.length; k++)
    Ez[idx(CX, srcJ[k])] = s;

  for (i = 0; i < NX * NY; i++)
    if (PEC[i]) Ez[i] = 0;

  for (j = 1; j < NY - 1; j++) {
    Ez[idx(0, j)] = EzPrev[idx(1, j)] + abc * (Ez[idx(1, j)] - Ez[idx(0, j)]);
    Ez[idx(NX - 1, j)] = EzPrev[idx(NX - 2, j)] + abc * (Ez[idx(NX - 2, j)] - Ez[idx(NX - 1, j)]);
  }
  for (i = 1; i < NX - 1; i++) {
    Ez[idx(i, 0)] = EzPrev[idx(i, 1)] + abc * (Ez[idx(i, 1)] - Ez[idx(i, 0)]);
    Ez[idx(i, NY - 1)] = EzPrev[idx(i, NY - 2)] + abc * (Ez[idx(i, NY - 2)] - Ez[idx(i, NY - 1)]);
  }

  for (i = 0; i < NX * NY; i++) EzPrev[i] = Ez[i];
  step++;
}

function getPattern() {
  var R = Math.min(NX, NY) / 3;
  var pat = new Float64Array(360);
  var maxV = 0;
  for (var k = 0; k < 360; k++) {
    var th = k / 360 * 2 * Math.PI;
    var ix = Math.round(CX + R * Math.cos(th));
    var iy = Math.round(CY + R * Math.sin(th));
    if (ix >= 0 && ix < NX && iy >= 0 && iy < NY) {
      pat[k] = Math.abs(Ez[idx(ix, iy)]);
      if (pat[k] > maxV) maxV = pat[k];
    }
  }
  if (maxV > 1e-15) for (var k = 0; k < 360; k++) pat[k] /= maxV;
  return pat;
}

function renderField() {
  var c = document.getElementById('fieldCanvas');
  var ctx = c.getContext('2d');
  var w = c.width, h = c.height;
  var cw = w / NX, ch = h / NY;

  var maxAbs = 0;
  for (var i = 0; i < NX * NY; i++) {
    var v = Math.abs(Ez[i]);
    if (v > maxAbs) maxAbs = v;
  }
  var scale = maxAbs > 1e-10 ? 1 / maxAbs : 1;

  for (var i = 0; i < NX; i++) {
    for (var j = 0; j < NY; j++) {
      var val = Ez[idx(i, j)] * scale;
      var r = Math.round(Math.max(0, Math.min(255, val > 0 ? 128 + val * 127 : 128)));
      var g = Math.round(Math.max(0, Math.min(255, 128 - Math.abs(val) * 127)));
      var b = Math.round(Math.max(0, Math.min(255, val < 0 ? 128 - val * 127 : 128)));
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(i * cw, j * ch, cw + 1, ch + 1);
    }
  }

  var half = DLEN >> 1, gh = FGAP >> 1;
  var ds = CY - half, de = CY + half;
  var gs = CY - gh, ge = CY + gh;
  ctx.fillStyle = 'rgba(0,255,136,0.4)';
  ctx.fillRect(CX * cw - 1, ds * ch, 3, (de - ds) * ch);
  ctx.fillStyle = 'rgba(255,255,0,0.3)';
  ctx.fillRect(CX * cw - 1, ds * ch, 3, (gs - ds) * ch);
  ctx.fillRect(CX * cw - 1, ge * ch, 3, (de - ge) * ch);
  ctx.fillStyle = 'rgba(255,0,0,0.5)';
  ctx.fillRect(CX * cw - 1, gs * ch, 3, (ge - gs) * ch);
}

function renderPattern(pat) {
  var c = document.getElementById('patternCanvas');
  var ctx = c.getContext('2d');
  var w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);

  var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 30;
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, R / 2, 0, 2 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
  ctx.stroke();

  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var k = 0; k <= 360; k++) {
    var th = (k % 360) / 360 * 2 * Math.PI;
    var r = pat[k % 360] * R;
    var x = cx + r * Math.cos(th);
    var y = cy - r * Math.sin(th);
    if (k === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = '#888';
  ctx.font = '12px Arial';
  ctx.fillText('0°', cx + R + 5, cy + 4);
  ctx.fillText('90°', cx + 4, cy - R - 5);
  ctx.fillText('180°', cx - R - 30, cy + 4);
  ctx.fillText('270°', cx + 4, cy + R + 15);
}

function tick() {
  if (!running) return;
  var spf = parseInt(document.getElementById('speedRange').value);
  for (var s = 0; s < spf; s++) stepFDTD();
  renderField();
  if (step > 50) renderPattern(getPattern());
  document.getElementById('stepDisplay').textContent = step;
  requestAnimationFrame(tick);
}

document.getElementById('btnPlay').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? '暂停' : '运行';
  if (running) requestAnimationFrame(tick);
});

document.getElementById('btnReset').addEventListener('click', function() {
  var wasRun = running;
  running = false;
  Ez = new Float64Array(NX * NY);
  Hx = new Float64Array(NX * NY);
  Hy = new Float64Array(NX * NY);
  EzPrev = new Float64Array(NX * NY);
  PEC = new Uint8Array(NX * NY);
  srcJ = [];
  step = 0;
  (function init2() {
    var half = DLEN >> 1, gh = FGAP >> 1;
    var ds = CY - half, de = CY + half;
    var gs = CY - gh, ge = CY + gh;
    for (var i = CX; i < Math.min(CX + 3, NX); i++)
      for (var j = ds; j <= de; j++)
        if (j >= 0 && j < NY && !(j >= gs && j <= ge))
          PEC[idx(i, j)] = 1;
    for (var j = CY - gh; j <= CY + gh; j++)
      if (j >= 0 && j < NY) srcJ.push(j);
  })();
  renderField();
  renderPattern(new Float64Array(360));
  document.getElementById('stepDisplay').textContent = '0';
  if (wasRun) { running = true; requestAnimationFrame(tick); }
});

renderField();
renderPattern(new Float64Array(360));
requestAnimationFrame(tick);
</script>
</body>
</html>
